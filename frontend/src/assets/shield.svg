<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Scut de securitate">
  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff1a1a"/>
      <stop offset="1" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="radarClip">
      <circle cx="100" cy="100" r="92"/>
    </clipPath>
  </defs>

  <!-- inele radar -->
  <g fill="none" stroke="#e60000" stroke-opacity="0.25" stroke-width="1.2">
    <circle cx="100" cy="100" r="92"/>
    <circle cx="100" cy="100" r="70" stroke-dasharray="4 6"/>
    <circle cx="100" cy="100" r="48"/>
  </g>

  <!-- fascicul radar care se rotește -->
  <g clip-path="url(#radarClip)">
    <path d="M100 100 L192 100 A92 92 0 0 0 165 35 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate"
        from="0 100 100" to="360 100 100" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- puncte = amenințări detectate -->
  <circle cx="42" cy="62" r="3" fill="#ff3b3b">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="140" r="3" fill="#ff3b3b">
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="48" r="2.5" fill="#ff3b3b">
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- scutul -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -3; 0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M100 48 L136 60 V96 C136 120 120 138 100 148 C80 138 64 120 64 96 V60 Z"
      fill="url(#shieldFill)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <!-- lacăt -->
    <path d="M90 96 V88 a10 10 0 0 1 20 0 V96" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <rect x="84" y="95" width="32" height="26" rx="5" fill="#ffffff"/>
    <circle cx="100" cy="106" r="3.5" fill="#990000"/>
    <rect x="98.5" y="107" width="3" height="7" rx="1.5" fill="#990000"/>
  </g>
</svg>
